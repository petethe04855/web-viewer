<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Changli — resonator stage</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05080f; }
    canvas { display: block; }
    #hud {
      position: fixed; inset: auto auto 16px 16px; padding: 8px 12px; border-radius: 8px;
      font: 12px/1.5 ui-monospace, monospace; color: #cfd6e4; background: rgba(10, 16, 26, .62);
      border: 1px solid rgba(140, 200, 255, .18); pointer-events: none;
    }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      font: 14px ui-monospace, monospace; color: #cfd6e4;
    }
    #animBar {
      position: fixed; top: 16px; left: 16px; display: flex; gap: 8px; align-items: center;
      padding: 8px 10px; border-radius: 8px; background: rgba(10, 16, 26, .72);
      border: 1px solid rgba(140, 200, 255, .18); font: 12px ui-monospace, monospace; color: #cfd6e4;
    }
    #animBar select, #animBar button {
      background: #101826; color: #cfd6e4; border: 1px solid rgba(140, 200, 255, .22);
      border-radius: 6px; padding: 3px 6px; font: inherit;
    }
    #animBar label { display: flex; gap: 6px; align-items: center; }
    body.clean #hud, body.clean #animBar { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">loading…</div>
  <div id="hud"></div>
  <div id="animBar" hidden>
    <select id="animList"></select>
    <button id="playPause">pause</button>
    <label><input id="loop" type="checkbox" checked /> loop</label>
    <label><input id="follow" type="checkbox" checked /> follow</label>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const params = new URLSearchParams(location.search);
    const defaultModel = 'exports/changli/Client/Content/Aki/Character/Role/FemaleXL/ChangLi/R2T1ChangLiMd10011/Model/R2T1ChangLiMd10011_animated.glb';
    const modelPath = params.get('model') || defaultModel;
    const spaceStage = params.get('bg') !== 'plain';
    if (params.get('ui') === '0') document.body.classList.add('clean');

    // Supersampling, on purpose: the maps top out at 2048 for the whole body, so
    // a close-up is limited by what the rasteriser draws, not by the textures.
    // Rendering at 1.5x and letting the browser downsample is what actually
    // cleans up the hair strands and the eyelashes. ?ss=1 for weak GPUs, ?ss=2
    // for stills.
    const ssFactor = Number(params.get('ss') ?? 1);
    const renderScale = Math.max(1, Math.min(
      devicePixelRatio * ssFactor,
      2.5,
      // keep the drawing buffer under ~4.2 Mpx whatever the window is
      Math.sqrt(4.2e6 / (innerWidth * innerHeight)),
    ));
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(renderScale);
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 0.97;
    // The game shades the hair onto the face and the cloth onto the skin, which
    // is most of what makes its colours read so differently from a flat render.
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080f);

    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.001, 1000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ---------------------------------------------------------------- grade
    // The game runs its characters through a post stack, so a straight render
    // never sits on the same colours: a printed-contrast curve, a touch of
    // bloom on the gold trim and the sky, then the tone map on top.
    // EffectComposer draws through its own render target, and a plain target
    // drops the renderer's MSAA: every silhouette comes out stair-stepped even
    // though the canvas asked for antialiasing. A multisampled, half-float
    // target keeps the edges smooth and the bloom in HDR.
    const composerTarget = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
      type: THREE.HalfFloatType,
      samples: 4,
    });
    const composer = new EffectComposer(renderer, composerTarget);
    // The composer keeps its own copy of the pixel ratio, so the supersampled
    // buffer has to be pushed into it or the post chain would render at 1x and
    // upscale the result.
    composer.setPixelRatio(renderer.getPixelRatio());
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new RenderPass(scene, camera));

    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.65, 0.82);
    composer.addPass(bloom);

    const gradePass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uContrast: { value: 1.06 },
        uSaturation: { value: 1.05 },
        uVignette: { value: 0.16 },
        uSharpen: { value: 0.55 },
        uTexel: { value: new THREE.Vector2(1 / (innerWidth * renderScale), 1 / (innerHeight * renderScale)) },
      },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;
        uniform float uContrast;
        uniform float uSaturation;
        uniform float uVignette;
        uniform float uSharpen;
        uniform vec2 uTexel;
        varying vec2 vUv;
        void main() {
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          // Contrast around mid-grey, then a gentle S-curve so the cel bands
          // sit apart the way the game's LUT separates them.
          c = (c - 0.5) * uContrast + 0.5;
          c = mix(c, c * c * (3.0 - 2.0 * c), 0.18);
          float luma = dot(c, vec3(0.2126, 0.7152, 0.0722));
          c = mix(vec3(luma), c, uSaturation);
          // Warm the highlights, cool the shadows — the game's grade does this.
          c *= mix(vec3(0.97, 0.98, 1.03), vec3(1.03, 1.0, 0.98), smoothstep(0.35, 0.9, luma));
          // The bloom softens the whole frame, and the maps are only 2048 for a
          // full body, so a small unsharp brings the cel edges back without
          // inventing halos (the amount is low and clamped).
          vec3 blur = (
            texture2D(tDiffuse, vUv + vec2(uTexel.x, 0.0)).rgb +
            texture2D(tDiffuse, vUv - vec2(uTexel.x, 0.0)).rgb +
            texture2D(tDiffuse, vUv + vec2(0.0, uTexel.y)).rgb +
            texture2D(tDiffuse, vUv - vec2(0.0, uTexel.y)).rgb
          ) * 0.25;
          c = clamp(c + (c - blur) * uSharpen, 0.0, 1.0);
          vec2 d = vUv - 0.5;
          c *= 1.0 - uVignette * dot(d, d);
          gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
        }
      `,
    });
    // Tone mapping + output colour space, then the grade on the display values
    // (working in linear HDR here would clip the highlights before the curve).
    composer.addPass(new OutputPass());
    composer.addPass(gradePass);

    const render = () => {
      syncHeadY();
      composer.render();
    };
    window.__render = render;
    window.__composer = composer;

    // ---------------------------------------------------------------- stage
    // A nebula dome, a glow behind the character and a pool of light on the
    // floor. Everything here is scenery only — no HUD/UI shapes.

    const NOISE_GLSL = /* glsl */ `
      float hash13(vec3 p3) {
        p3 = fract(p3 * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      float noise3(vec3 x) {
        vec3 p = floor(x);
        vec3 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(mix(hash13(p + vec3(0,0,0)), hash13(p + vec3(1,0,0)), f.x),
              mix(hash13(p + vec3(0,1,0)), hash13(p + vec3(1,1,0)), f.x), f.y),
          mix(mix(hash13(p + vec3(0,0,1)), hash13(p + vec3(1,0,1)), f.x),
              mix(hash13(p + vec3(0,1,1)), hash13(p + vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p) {
        float a = 0.5, s = 0.0;
        for (int i = 0; i < 5; i++) { s += a * noise3(p); p *= 2.03; a *= 0.5; }
        return s;
      }
    `;

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(10, 48, 24),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
        uniforms: { uTime: { value: 0 } },
        vertexShader: /* glsl */ `
          varying vec3 vDir;
          void main() {
            vDir = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;
          varying vec3 vDir;
          uniform float uTime;
          ${NOISE_GLSL}
          void main() {
            vec3 d = normalize(vDir);
            // Screen vertical is a narrow slice of the dome at this FOV, so the
            // gradient is keyed to elevation (d.y) rather than the whole sphere.
            float y = d.y;

            // Deep space: near-black zenith easing into a dim blue ambient at
            // the horizon, like the resonator screens.
            float ambient = 1.0 - smoothstep(-0.02, 0.42, y);
            vec3 col = mix(vec3(0.006, 0.010, 0.024), vec3(0.020, 0.034, 0.066), ambient);

            // Nebula wisps hanging behind the head and shoulders.
            float band = smoothstep(-0.10, 0.04, y) * (1.0 - smoothstep(0.22, 0.36, y));
            // Horizontally stretched sampling keeps the wisps streaky, not blobby.
            vec3 nd = vec3(d.x * 1.5, d.y * 3.0, d.z * 1.5);
            float n1 = fbm(nd * 1.9 + vec3(0.0, uTime * 0.006, uTime * 0.004));
            float n2 = fbm(d * 4.6 - vec3(0.7, 1.3, 0.2));
            float cloud = smoothstep(0.40, 0.80, n1 * 0.82 + n2 * 0.38);
            vec3 cloudCol = mix(vec3(0.07, 0.20, 0.33), vec3(0.16, 0.17, 0.33), smoothstep(0.35, 0.75, n2));
            col += cloudCol * cloud * band * 0.35;
            // a few brighter cyan cores inside the thicker clouds
            col += vec3(0.10, 0.28, 0.42) * pow(cloud, 3.0) * band * 0.25;

            // Thin drifting veil just above the fog bank.
            float veil = 1.0 - smoothstep(-0.16, 0.02, y);
            float wisp = fbm(d * 1.7 + vec3(uTime * 0.02, 0.0, uTime * 0.01));
            col += vec3(0.08, 0.13, 0.20) * veil * smoothstep(0.42, 0.85, wisp) * 0.45;

            // Ground fog: a pale, luminous bank swallowing the lower screen.
            float fog = 1.0 - smoothstep(-0.42, -0.05, y);
            float mistNoise = 0.88 + 0.12 * noise3(d * 6.0 + vec3(0.0, 0.0, uTime * 0.02));
            col += vec3(0.62, 0.68, 0.77) * pow(fog, 1.9) * 0.85 * mistNoise;

            // Sparse star field, hidden where the fog takes over.
            vec3 sp = d * 260.0;
            vec3 cell = floor(sp);
            float rnd = hash13(cell);
            if (rnd > 0.9825) {
              vec3 f = fract(sp) - 0.5;
              float size = mix(0.07, 0.26, fract(rnd * 91.7));
              float twinkle = 0.6 + 0.4 * sin(uTime * 1.6 + rnd * 60.0);
              float star = smoothstep(size, 0.0, length(f)) * twinkle;
              col += vec3(0.80, 0.89, 1.0) * star * 1.5 * smoothstep(-0.05, 0.07, y);
            }

            gl_FragColor = vec4(col, 1.0);
          }
        `,
      }),
    );
    sky.renderOrder = -1000;
    sky.frustumCulled = false;

    function radialTexture(inner, outer) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      gradient.addColorStop(0, inner);
      gradient.addColorStop(0.45, outer);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const aura = new THREE.Sprite(new THREE.SpriteMaterial({
      map: radialTexture('rgba(205,230,255,0.55)', 'rgba(95,150,210,0.16)'),
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.1,
    }));
    aura.scale.setScalar(2.2);

    const floorGlow = new THREE.Mesh(
      new THREE.CircleGeometry(1.5, 64),
      new THREE.MeshBasicMaterial({
        map: radialTexture('rgba(225,238,252,0.55)', 'rgba(95,140,195,0.16)'),
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.35,
      }),
    );
    floorGlow.rotation.x = -Math.PI / 2;

    // Wide, very soft mist billboard that sits behind the character and melts
    // into the sky's fog bank.
    const mist = new THREE.Sprite(new THREE.SpriteMaterial({
      map: radialTexture('rgba(215,232,248,0.5)', 'rgba(105,150,205,0.14)'),
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true,
      opacity: 0.05,
    }));

    if (spaceStage) {
      scene.add(sky, aura, floorGlow, mist);
      scene.background = null;
    }

    // Game-screen lighting: a warm key from the front and an equally warm, much
    // weaker fill. The game keeps skin shadows pink, not blue, so a cool fill
    // would grey the face out. The cool silhouette light is done in the
    // character shader, not with another directional light.
    const key = new THREE.DirectionalLight(0xfff2e8, 2.6);
    key.position.set(2.2, 3.4, 3.6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.015;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 9;
    key.shadow.camera.left = -1.4;
    key.shadow.camera.right = 1.4;
    key.shadow.camera.top = 1.8;
    key.shadow.camera.bottom = -1.8;
    key.target.position.set(0, 1.1, 0);
    scene.add(key, key.target);

    const fill = new THREE.DirectionalLight(0xffe9e4, 0.45);
    fill.position.set(-3, 1.2, 2.5);
    scene.add(fill);

    // Warm bounce so the skin under the chin and the red cloth do not go cold.
    const bounce = new THREE.DirectionalLight(0xffd6b8, 0.16);
    bounce.position.set(0.4, -0.6, 2.4);
    scene.add(bounce);

    scene.add(new THREE.AmbientLight(0xfff0ea, 0.25));

    // ---------------------------------------------------------- character
    // Inked silhouette. Back faces only, pushed a few millimetres along their
    // normals: from the front the shell hides behind the character and only its
    // edge shows, which is the dark line the game draws around everything.
    function makeOutline(thickness) {
      const material = new THREE.MeshBasicMaterial({ color: 0x1c1016, side: THREE.BackSide });
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uOutline = { value: thickness };
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nuniform float uOutline;')
          // A fixed world-space shell is a thick line in a close-up and a hairline
          // from three metres away. Scaling the push with view distance keeps
          // the ink about the same weight in pixels, the way the game's
          // screen-space outline does.
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
              float oDist = -(modelViewMatrix * vec4(position, 1.0)).z;
              float oPush = uOutline * clamp(oDist / 0.42, 0.55, 3.0);
              transformed += normal * oPush;`,
          )
          // The shell grows along the surface normal, so it also creeps towards
          // the camera and paints over anything sitting within that distance:
          // stacked thin layers (the brooch 0.9 mm off the cloth, the inner
          // shell of the dress) came out with black rags on them. Sinking the
          // shell by most of its own thickness puts it behind those layers again
          // while the silhouette, which only competes with the background, is
          // unaffected.
          .replace(
            'gl_Position = projectionMatrix * mvPosition;',
            'mvPosition.z -= oPush * 0.85;\n\tgl_Position = projectionMatrix * mvPosition;',
          );
      };
      return material;
    }

    // Hair cards are thin and numerous, so the same thickness that suits the
    // dress turns the fringe into a black mass.
    const outlineMaterial = makeOutline(0.0016);
    const hairOutlineMaterial = makeOutline(0.0007);
    // The face is a single shell with a mouth cavity, so its hull is barely
    // thicker than the surface — just enough to ink the jaw and the lips.
    const faceOutlineMaterial = makeOutline(0.0003);

    // The game shades characters with a hard stepped ramp plus a cyan rim on
    // the silhouette, so PBR is replaced with a toon material carrying that
    // rim (and, for the long hair, the blue gradient on its tips).

    // Three.js samples the ramp at dot(N,L) * 0.5 + 0.5, so only the second
    // half of the texture is ever used. Cloth keeps 4 readable cel bands but the
    // lit ones sit high: the dress is bright with deep blue folds, not grey.
    const toonRamp = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0, 0, 0, 0, 0, 118, 152, 183, 205, 220, 231, 240, 247]), 16, 1, THREE.RedFormat);
    toonRamp.minFilter = THREE.NearestFilter;
    toonRamp.magFilter = THREE.NearestFilter;
    toonRamp.generateMipmaps = false;
    toonRamp.needsUpdate = true;

    // The game barely shades the face: it stays one flat warm tone and the
    // nose/cheek shadows are painted into the texture. Both halves of the ramp
    // stay high — a dark first half would drop a hard shadow down the nose.
    const faceShades = [];
    for (let i = 0; i < 16; i++) faceShades.push(Math.round(224 + (8 * i) / 15));
    for (let i = 0; i < 16; i++) faceShades.push(Math.round(232 + (15 * i) / 15));
    const faceRamp = new THREE.DataTexture(new Uint8Array(faceShades), 32, 1, THREE.RedFormat);
    faceRamp.minFilter = THREE.NearestFilter;
    faceRamp.magFilter = THREE.NearestFilter;
    faceRamp.generateMipmaps = false;
    faceRamp.needsUpdate = true;

    // Hair shades down to a deep maroon: the game's hair shadows are darker than
    // the cloth's, which keeps the coral from turning into flat pink.
    const hairRamp = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0, 0, 0, 0, 0, 46, 78, 116, 152, 182, 208, 230, 248]), 16, 1, THREE.RedFormat);
    hairRamp.minFilter = THREE.NearestFilter;
    hairRamp.magFilter = THREE.NearestFilter;
    hairRamp.generateMipmaps = false;
    hairRamp.needsUpdate = true;

    // Per-material grade, in one place so it can be compared against the game's
    // own colour readout instead of being buried in the shader.
    function gradeFor(name) {
      // Coral hair: the exported albedo is already the right salmon, so the
      // hair is only nudged warm — a violet tint here is what turned the whole
      // head pink-mauve. Shadows stay coral (warm multiplier) instead of taking
      // the cloth's blue ambient.
      if (/Bangs/.test(name)) return { rim: 0.12, grade: 1.0, tint: new THREE.Color(1.04, 0.97, 0.94), cool: 0.45, coolTint: new THREE.Color(1.0, 0.86, 0.90), pale: 0.0, tip: 0.95, tipLow: -0.08, tipHigh: 0.02 };
      if (/Hair/.test(name)) return { rim: 0.12, grade: 1.0, tint: new THREE.Color(1.04, 0.97, 0.94), cool: 0.45, coolTint: new THREE.Color(1.0, 0.86, 0.90), pale: 0.0, tip: 0.95, tipLow: -0.46, tipHigh: -0.22 };
      if (/Face/.test(name)) return { rim: 0.2, grade: 1.0, tint: new THREE.Color(1.0, 1.06, 1.12), cool: 0.0, pale: 0.0, blue: 0.0, tip: 0.0 };
      if (/Eye/.test(name)) return { rim: 0.2, grade: 1.0, tint: 0xffffff, cool: 0.0, pale: 0.0, blue: 0.0, tip: 0.0 };
      // "Up" carries the white dress *and* the skin, so the ice-blue cast is
      // applied by a low-saturation mask in the shader (uBlue) rather than a
      // flat tint that would turn the arms blue too.
      // "Up" carries the dress and the skin, and the skin in the game sits on
      // the cool side even in shadow — pink-mauve, not tan — so it takes a
      // stronger lavender ambient than the rest of the outfit.
      if (/Up/.test(name)) return { rim: 0.3, grade: 1.0, tint: 0xffffff, cool: 0.75, coolTint: new THREE.Color(0.95, 0.94, 1.14), pale: 0.3, blue: 1.0, tip: 0.0 };
      if (/Down/.test(name)) return { rim: 0.3, grade: 1.0, tint: 0xffffff, cool: 0.55, coolTint: new THREE.Color(0.88, 0.93, 1.14), pale: 0.3, blue: 1.0, tip: 0.0 };
      return { rim: 0.3, grade: 1.0, tint: 0xffffff, cool: 0.55, coolTint: new THREE.Color(0.88, 0.93, 1.14), pale: 0.3, blue: 1.0, tip: 0.0 };
    }

    // Hair shaders that need the head's height every frame, so the tip band
    // follows the body instead of the world (a crouch would flood the crown).
    const tipShaders = [];

    function celMaterial(source, name) {
      const g = gradeFor(name);
      const cel = new THREE.MeshToonMaterial({
        map: source.map,
        color: source.color,
        gradientMap: /Face|Eye/.test(name) ? faceRamp : /Hair|Bangs/.test(name) ? hairRamp : toonRamp,
        side: source.side,
        transparent: source.transparent,
        opacity: source.opacity,
        alphaTest: source.alphaTest,
      });
      cel.name = name;
      // Fabric and hair are seen at grazing angles most of the time; without
      // anisotropic filtering the 2048 maps smear into mush near the hem.
      if (cel.map) cel.map.anisotropy = renderer.capabilities.getMaxAnisotropy();

      // The five-point star on the sternum is a dark decal, but the export
      // flattened its alpha channel: the transparent surround came through as
      // solid red, which is why the chest read as a red gem the game does not
      // have. The plate is tiny (~5 cm), so the surround is recovered from the
      // albedo itself — anything that is either saturated red or near-white is
      // backdrop, everything else is the sparkle — and the sparkle is drawn in
      // the game's ink navy.
      if (/XingStar/.test(name)) {
        cel.transparent = true;
        cel.onBeforeCompile = (shader) => {
          shader.uniforms.uSparkle = { value: new THREE.Color(0x171c3d) };
          shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>', '#include <common>\nuniform vec3 uSparkle;')
            .replace('#include <map_fragment>', `#include <map_fragment>
              float sparkLuma = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
              float sparkRed = diffuseColor.r / max(max(diffuseColor.g, diffuseColor.b), 1e-4);
              // Red or near-white is backdrop; what is left fades with luma so
              // only the dark core of the sparkle stays solid, the way the
              // game's thin ink line reads.
              float backdrop = max(
                smoothstep(1.5, 2.2, sparkRed),
                smoothstep(0.82, 0.95, sparkLuma)
              );
              float ink = 1.0 - smoothstep(0.28, 0.62, sparkLuma);
              diffuseColor.rgb = uSparkle;
              diffuseColor.a *= (1.0 - backdrop) * ink;`);
        };
        return cel;
      }

      cel.onBeforeCompile = (shader) => {
        // The silhouette light is a faint cool edge: strong enough to lift the
        // outline off the nebula, weak enough to leave the lavender tips cool.
        shader.uniforms.uRimColor = { value: new THREE.Color(0xb9d4f6) };
        shader.uniforms.uRimStrength = { value: g.rim };
        shader.uniforms.uTipColor = { value: new THREE.Color(0x5f68c8) };
        shader.uniforms.uTipAmount = { value: g.tip };
        // tipLow/tipHigh are heights relative to the head joint (metres) where
        // the lavender wash takes over, read off the strand ends — the exported
        // albedo has no lavender gradient of its own.
        shader.uniforms.uTipLow = { value: g.tipLow ?? 0 };
        shader.uniforms.uTipHigh = { value: g.tipHigh ?? 0 };
        // Head height, so the band survives crouches and jumps; it stays level
        // with the world rather than following the bone's roll.
        shader.uniforms.uHeadY = { value: 1.4 };
        if (g.tip > 0) tipShaders.push(shader);
        shader.uniforms.uTint = { value: new THREE.Color(g.tint) };
        shader.uniforms.uGrade = { value: g.grade };
        shader.uniforms.uCool = { value: g.cool };
        shader.uniforms.uCoolTint = { value: g.coolTint ?? new THREE.Color(0.9, 0.95, 1.09) };
        shader.uniforms.uPale = { value: g.pale };
        shader.uniforms.uMetal = { value: /Up|Down|Cloth/.test(name) ? 1.0 : 0.0 };
        shader.uniforms.uBlue = { value: g.blue ?? 0 };
        shader.uniforms.uCrimson = { value: /Face|Eye|Hair|Bangs/.test(name) ? 0.0 : 1.0 };
        cel.userData.shader = shader;

        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying float vHairY;\nuniform float uHeadY;')
          .replace('#include <skinning_vertex>', '#include <skinning_vertex>\n\tvHairY = transformed.y - uHeadY;');

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>
            varying float vHairY;
            uniform vec3 uRimColor;
            uniform float uRimStrength;
            uniform vec3 uTipColor;
            uniform float uTipAmount;
            uniform float uTipLow;
            uniform float uTipHigh;
            uniform vec3 uTint;
            uniform float uGrade;
            uniform float uCool;
            uniform float uPale;
            uniform float uCrimson;
            uniform vec3 uCoolTint;
            uniform float uBlue;
            uniform float uMetal;`)
          .replace('#include <map_fragment>', `#include <map_fragment>
            float gradeLuma = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
            diffuseColor.rgb = clamp(mix(vec3(gradeLuma), diffuseColor.rgb, uGrade), 0.0, 1.0);
            // Near-neutral fabric: lift it so the dress stays pale blue, not grey.
            float paleMax = max(max(diffuseColor.r, diffuseColor.g), diffuseColor.b);
            float paleSat = (paleMax - min(min(diffuseColor.r, diffuseColor.g), diffuseColor.b)) / max(paleMax, 1e-4);
            float paleMask = (1.0 - smoothstep(0.06, 0.24, paleSat)) * smoothstep(0.35, 0.6, gradeLuma);
            diffuseColor.rgb *= 1.0 + paleMask * uPale;
            // The exported fabric albedo is warm white; the game's is ice blue.
            diffuseColor.rgb *= mix(vec3(1.0), vec3(0.74, 0.90, 1.16), paleMask * uBlue);
            // Pewter fittings are neutral and mid-tone: the game's hardware is
            // blue-grey, not warm grey. Cloth (high luma) and skin (saturated)
            // fall outside the mask.
            float metalMask = (1.0 - smoothstep(0.05, 0.20, paleSat))
              * smoothstep(0.28, 0.42, gradeLuma)
              * (1.0 - smoothstep(0.80, 0.92, gradeLuma));
            diffuseColor.rgb *= mix(vec3(1.0), vec3(0.56, 0.69, 1.00), metalMask * uMetal);
            // Shaded cloth picks up the resonator's blue-lavender ambient.
            diffuseColor.rgb *= mix(vec3(1.0), uCoolTint, uCool * (1.0 - gradeLuma));
            // The crimson sash/ribbons are far more saturated in game than the
            // exported albedo, which is a soft coral red.
            float crimson = smoothstep(1.25, 1.7, diffuseColor.r / max(max(diffuseColor.g, diffuseColor.b), 1e-4));
            diffuseColor.rgb *= mix(vec3(1.0), vec3(1.02, 0.75, 0.60), crimson * uCrimson);
            diffuseColor.rgb *= uTint;
            // Lavender tips, banded to the bottom of the strands only: the wash
            // is full below uTipLow and gone above uTipHigh, so the crown and
            // most of each lock stay coral.
            float tipMask = 1.0 - smoothstep(uTipLow, uTipHigh, vHairY);
            float tip = tipMask * uTipAmount;
            // Pale ends are nearly white, so the violet has to be pushed hard
            // before lighting floods it back out.
            vec3 tipCol = uTipColor * (0.6 + 1.0 * gradeLuma);
            diffuseColor.rgb = mix(diffuseColor.rgb, tipCol, tip);`)
          .replace('#include <opaque_fragment>', `// Pale cool edge on the silhouette, the game's "outline".
            float rim = 1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
            outgoingLight += uRimColor * pow(rim, 4.0) * uRimStrength;
            #include <opaque_fragment>`);
      };

      return cel;
    }

    // Exposed so a headless session can pose the rig and grab frames.
    window.__three = THREE;
    window.__renderer = renderer;
    window.__scene = scene;
    window.__camera = camera;

    let mixer = null;
    let followBone = null;
    let headBone = null;
    const headPoint = new THREE.Vector3();
    const followTarget = new THREE.Vector3();

    // The lavender band is measured down from the head joint, which is the only
    // stable reference across clips: a run crouches 13 cm, a burst lifts the
    // whole rig 2.3 m off the floor.
    function syncHeadY() {
      if (!headBone || !tipShaders.length) return;
      headBone.getWorldPosition(headPoint);
      for (const shader of tipShaders) shader.uniforms.uHeadY.value = headPoint.y;
    }

    // Root motion in the clips moves the rig metres away from the origin, so
    // the camera rides along with the hips or the character walks out of frame.
    function updateFollow(instant) {
      if (!followBone || !document.getElementById('follow')?.checked) return;
      followBone.getWorldPosition(followTarget);
      const offset = camera.position.clone().sub(controls.target);
      controls.target.lerp(followTarget, instant ? 1 : 0.12);
      camera.position.copy(controls.target).add(offset);
      camera.lookAt(controls.target);
    }

    function updateStage(time, instant) {
      if (!spaceStage) return;
      sky.position.copy(camera.position);
      sky.material.uniforms.uTime.value = time;

      followTarget.copy(controls.target);
      aura.position.copy(followTarget).add(new THREE.Vector3(0, 0.25, 0));
      // keep the glow behind the character, not in front of the camera
      const back = camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(-0.9);
      aura.position.add(back);

      // Mist sits two metres into the scene, low enough to hug the ground.
      const away = camera.getWorldDirection(new THREE.Vector3());
      mist.position.copy(followTarget).addScaledVector(away, 2.0);
      mist.position.y = followTarget.y - mist.scale.y * 0.18;

      floorGlow.position.set(followTarget.x, 0.012, followTarget.z);
    }

    new GLTFLoader().load(modelPath, (gltf) => {
      const root = gltf.scene;
      window.__model = root;
      scene.add(root);

      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z);

      camera.position.copy(center).add(new THREE.Vector3(0, size.y * 0.02, radius * 2.0));
      camera.near = radius / 1000;
      camera.far = radius * 20;
      camera.updateProjectionMatrix();
      controls.target.copy(center).add(new THREE.Vector3(0, size.y * 0.02, 0));
      controls.update();

      followBone = root.getObjectByName('Bip001Pelvis') ?? root;
      headBone = root.getObjectByName('Bip001Head') ?? null;
      floorGlow.scale.setScalar(size.y * 0.9);
      aura.scale.setScalar(size.y * 1.15);
      mist.scale.set(size.y * 3.4, size.y * 1.35, 1);

      let triangles = 0;
      const materials = new Set();
      root.traverse((o) => {
        if (!o.isMesh) return;
        // Skinned meshes keep their bind-pose bounding sphere, so once a clip
        // with root motion carries the character away from the origin three.js
        // culls the whole body. Always draw them.
        o.frustumCulled = false;
        o.castShadow = true;
        o.receiveShadow = true;
        const count = o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count;
        triangles += count / 3;
        const sources = [].concat(o.material);
        const cels = sources.map((m) => {
          const name = m.name || '(unnamed)';
          materials.add(name);
          return celMaterial(m, name);
        });
        o.material = Array.isArray(o.material) ? cels : cels[0];

        // Inverted hull: the same geometry, back faces only, pushed out along
        // the normals. Skinning is applied by three as usual, so it follows the
        // rig. The face, eyes and the small star skip it: their shells are
        // larger than the feature they wrap and cover the mouth and irises.
        const matName = sources[0].name || '';
        if (/Eye|XingStar/.test(matName)) return;
        const hull = /Hair|Bangs/.test(matName) ? hairOutlineMaterial : /Face/.test(matName) ? faceOutlineMaterial : outlineMaterial;
        const shell = o.isSkinnedMesh ? new THREE.SkinnedMesh(o.geometry, hull) : new THREE.Mesh(o.geometry, hull);
        if (o.isSkinnedMesh) {
          shell.bind(o.skeleton, o.bindMatrix);
          shell.bindMode = o.bindMode;
        }
        shell.name = o.name + '_outline';
        shell.frustumCulled = false;
        shell.castShadow = false;
        shell.receiveShadow = false;
        shell.renderOrder = -1;
        o.parent.add(shell);
      });

      const clipNames = (gltf.animations ?? []).map((clip) => clip.name);
      if (clipNames.length) {
        mixer = new THREE.AnimationMixer(root);
        window.__mixer = mixer;
        window.__clips = gltf.animations;

        const bar = document.getElementById('animBar');
        const list = document.getElementById('animList');
        for (const name of clipNames) {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          list.append(option);
        }

        const play = (name, time = 0) => {
          const clip = gltf.animations.find((c) => c.name === name) ?? gltf.animations[0];
          mixer.stopAllAction();
          const action = mixer.clipAction(clip);
          action.setLoop(document.getElementById('loop').checked ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
          action.play();
          mixer.setTime(time);
          list.value = clip.name;
          window.__currentClip = clip;
          return clip;
        };

        window.__play = play;
        window.__frame = (time) => {
          // setTime() runs through update(), which multiplies by timeScale, so a
          // paused mixer would ignore the requested time. Unpause for the jump.
          const scale = mixer.timeScale;
          mixer.timeScale = 1;
          mixer.setTime(time);
          mixer.timeScale = scale;
          root.updateMatrixWorld(true);
          updateFollow(true);
          updateStage(time, true);
          render();
        };

        bar.hidden = false;
        list.addEventListener('change', () => play(list.value));

        const button = document.getElementById('playPause');
        button.addEventListener('click', () => {
          const playing = button.textContent === 'pause';
          mixer.timeScale = playing ? 0 : 1;
          button.textContent = playing ? 'play' : 'pause';
        });

        const requested = params.get('anim');
        const startAt = Number(params.get('t') ?? 0);
        const preferred = clipNames.includes('Stand1') ? 'Stand1' : clipNames[0];
        play(requested ?? preferred, startAt);
        if (params.has('paused')) { mixer.timeScale = 0; button.textContent = 'play'; }
      }

      document.getElementById('loading').remove();
      document.getElementById('hud').textContent =
        `${modelPath.split('/').pop()} · ${Math.round(triangles).toLocaleString()} tris · ` +
        `${materials.size} materials · ${clipNames.length} animations`;
    }, undefined, (error) => {
      document.getElementById('loading').textContent = 'load failed: ' + error;
      console.error(error);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      const ratio = renderer.getPixelRatio();
      gradePass.uniforms.uTexel.value.set(1 / (innerWidth * ratio), 1 / (innerHeight * ratio));
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      const time = clock.elapsedTime;
      if (mixer) mixer.update(dt);
      controls.update();
      updateFollow(false);
      updateStage(time, false);
      render();
    });
  </script>
</body>
</html>
